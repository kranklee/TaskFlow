<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>TaskFlow – Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
</head>

<body class="bg-gradient">
    <header class="top-header">
        <div class="logo-wrap">
            <img src="/assets/logo.png" alt="CodeAxis logo" class="logo-img" />
            <span class="logo-text">CodeAxis</span>
        </div>
    </header>

    <main class="center-layout">
        <section class="card login-card">
            <h1 class="card-title">Welcome to TaskFlow!</h1>
            <p class="subtitle">
                Sign in to manage your time effectively.
            </p>

            <form id="loginForm" class="form">
                <div class="input-group-full">
                    <label class="field-label" for="loginEmail">Email Address</label>
                    <input
                        id="loginEmail"
                        type="email"
                        class="input"
                        placeholder="Enter your email"
                        required
                    />
                </div>

                <div class="input-group-full">
                    <div class="row between">
                        <label class="field-label" for="loginPassword">Password</label>
                        <a href="/forgot-password.html" class="link-sm">Forgot password?</a>
                    </div>
                    <input
                        id="loginPassword"
                        type="password"
                        class="input"
                        placeholder="Enter your password"
                        required
                    />
                </div>

                <p id="loginError" class="error-text"></p>

                <button type="submit" class="btn primary mt-12 full">
                    Log In
                </button>

                <div class="divider mt-8">OR</div>
                <button type="button" class="btn secondary">
                    <span class="google-icon">G</span> Log in with Google
                </button>

                <p class="small-text mt-16" style="text-align: center;">
                    New here?
                    <a href="/register.html" class="link-sm">Create an account</a>
                </p>
            </form>
        </section>
    </main>

    <footer class="footer">
        © 2025 CodeAxis | All rights reserved
    </footer>

    <script src="/js/auth.js"></script>
</body>
</html>
